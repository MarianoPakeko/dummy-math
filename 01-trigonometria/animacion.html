<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; background-color: #0e1117; font-family: sans-serif; color: white; overflow: hidden; }
  .toolbar { padding: 6px 12px; background: #161b22; border-radius: 8px; margin-bottom: 8px; border: 1px solid #30363d; display: flex; gap: 8px; align-items: center; }
  button { background-color: #238636; color: white; border: none; padding: 6px 14px; font-size: 13px; font-weight: 600; border-radius: 6px; cursor: pointer; }
  button.paused { background-color: #d29922; }
  .vbtn { background-color: #21262d; border: 1px solid #30363d; color: #c9d1d9; }
  .vbtn.s { background-color: #238636; border-color: #3fb950; color: white; }
  .vbtn.c { background-color: #1f6feb; border-color: #58a6ff; color: white; }
  .vbtn.t { background-color: #da3633; border-color: #f85149; color: white; }
  canvas { display: block; width: 100%; height: 340px; background-color: #0e1117; border-radius: 8px; border: 1px solid #21262d; }
</style>
</head>
<body>
  <div class="toolbar">
    <button id="toggleBtn" onclick="togglePlay()">__BTN_PAUSE__</button>
    <span style="color:#30363d;">|</span>
    <button id="bSin" class="vbtn s" onclick="setView('sin')">🟢 Vista Seno</button>
    <button id="bCos" class="vbtn" onclick="setView('cos')">🔵 Vista Coseno</button>
    <button id="bTan" class="vbtn" onclick="setView('tan')">🔴 Vista Tangente</button>
  </div>
  <canvas id="trigCanvas"></canvas>

  <script>
    const canvas = document.getElementById('trigCanvas');
    const ctx = canvas.getContext('2d');
    const btn = document.getElementById('toggleBtn');

    let isPlaying = true;
    let view = 'sin';
    let angle = 0;

    const active = __ACTIVE_JSON__;

    function togglePlay() {
      isPlaying = !isPlaying;
      btn.innerText = isPlaying ? "__BTN_PAUSE__" : "__BTN_PLAY__";
      btn.classList.toggle("paused", !isPlaying);
    }

    function setView(v) {
      view = v;
      document.getElementById('bSin').className = 'vbtn' + (v === 'sin' ? ' s' : '');
      document.getElementById('bCos').className = 'vbtn' + (v === 'cos' ? ' c' : '');
      document.getElementById('bTan').className = 'vbtn' + (v === 'tan' ? ' t' : '');
    }

    function drawWave(fn, color, isHighlighted, startX, width, centerY, scaleY) {
      ctx.save();
      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.globalAlpha = isHighlighted ? 1.0 : 0.14;
      ctx.lineWidth = isHighlighted ? 3.2 : 1.5;

      let drawing = false;
      for (let px = 0; px <= width; px += 2) {
        const theta = angle - (px / width) * 4 * Math.PI;
        const val = fn(theta);
        if (Math.abs(val) > 3.2 || isNaN(val)) {
          drawing = false;
          continue;
        }
        const py = centerY - val * scaleY;
        if (!drawing) {
          ctx.moveTo(startX + px, py);
          drawing = true;
        } else {
          ctx.lineTo(startX + px, py);
        }
      }
      ctx.stroke();
      ctx.restore();
    }

    function animate() {
      const w = canvas.clientWidth || window.innerWidth || 800;
      const h = 340;
      
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
      }

      ctx.clearRect(0, 0, w, h);

      const cx0 = Math.min(140, w * 0.22);
      const cy0 = h / 2;
      const r = 80;
      const wsx = cx0 + r + 60;
      const ww = Math.max(100, w - wsx - 20);

      // Ejes base y círculo unitario
      ctx.strokeStyle = '#30363d';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(cx0 - r - 15, cy0); ctx.lineTo(cx0 + r + 15, cy0);
      ctx.moveTo(cx0, cy0 - r - 15); ctx.lineTo(cx0, cy0 + r + 15);
      ctx.moveTo(wsx, cy0); ctx.lineTo(w - 20, cy0);
      ctx.stroke();

      ctx.strokeStyle = '#8b949e';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(cx0, cy0, r, 0, 2 * Math.PI);
      ctx.stroke();

      // Límites [-1, 1]
      ctx.save();
      ctx.strokeStyle = '#8b949e';
      ctx.globalAlpha = 0.25;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(wsx, cy0 - r); ctx.lineTo(w - 20, cy0 - r);
      ctx.moveTo(wsx, cy0 + r); ctx.lineTo(w - 20, cy0 + r);
      ctx.stroke();
      ctx.restore();

      const sinV = Math.sin(angle);
      const cosV = Math.cos(angle);
      const tanV = Math.tan(angle);

      const isCos = (view === 'cos');
      const px = isCos ? (cx0 + sinV * r) : (cx0 + cosV * r);
      const py = isCos ? (cy0 - cosV * r) : (cy0 - sinV * r);

      // 1. Vista Seno
      if (view === 'sin') {
        ctx.save();
        ctx.strokeStyle = '#3fb950';
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(px, cy0); ctx.lineTo(px, py); ctx.stroke();

        ctx.globalAlpha = 0.6;
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(wsx, py); ctx.stroke();

        ctx.globalAlpha = 1.0;
        ctx.fillStyle = '#3fb950';
        ctx.beginPath(); ctx.arc(wsx, py, 5, 0, 2 * Math.PI); ctx.fill();
        ctx.restore();
      }

      // 2. Vista Coseno
      if (view === 'cos') {
        ctx.save();
        ctx.strokeStyle = '#58a6ff';
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(px, cy0); ctx.lineTo(px, py); ctx.stroke();

        ctx.globalAlpha = 0.6;
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(wsx, py); ctx.stroke();

        ctx.globalAlpha = 1.0;
        ctx.fillStyle = '#58a6ff';
        ctx.beginPath(); ctx.arc(wsx, py, 5, 0, 2 * Math.PI); ctx.fill();
        ctx.restore();
      }

      // 3. Vista Tangente
      if (view === 'tan') {
        ctx.save();
        ctx.strokeStyle = '#f85149';
        ctx.globalAlpha = 0.3;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(cx0 + r, cy0 - r * 2.1);
        ctx.lineTo(cx0 + r, cy0 + r * 2.1);
        ctx.stroke();
        ctx.restore();

        if (Math.abs(tanV) <= 2.3) {
          const ty = cy0 - tanV * r;
          ctx.save();
          ctx.strokeStyle = '#f0883e';
          ctx.globalAlpha = 0.4;
          ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(cx0 + r, ty); ctx.stroke();

          ctx.strokeStyle = '#f85149';
          ctx.globalAlpha = 1.0;
          ctx.lineWidth = 4;
          ctx.beginPath(); ctx.moveTo(cx0 + r, cy0); ctx.lineTo(cx0 + r, ty); ctx.stroke();

          ctx.globalAlpha = 0.65;
          ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(cx0 + r, ty); ctx.lineTo(wsx, ty); ctx.stroke();

          ctx.globalAlpha = 1.0;
          ctx.fillStyle = '#f85149';
          ctx.beginPath(); ctx.arc(wsx, ty, 5, 0, 2 * Math.PI); ctx.fill();
          ctx.restore();
        }
      }

      // Radio giratorio
      ctx.save();
      ctx.strokeStyle = '#f0883e';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(cx0, cy0); ctx.lineTo(px, py); ctx.stroke();
      ctx.fillStyle = '#f0883e';
      ctx.beginPath(); ctx.arc(px, py, 5, 0, 2 * Math.PI); ctx.fill();
      ctx.restore();

      // Dibujar las 6 ondas
      drawWave(t => Math.sin(t), '#3fb950', active.sin, wsx, ww, cy0, r);
      drawWave(t => Math.cos(t), '#58a6ff', active.cos, wsx, ww, cy0, r);
      drawWave(t => Math.tan(t), '#f85149', active.tan, wsx, ww, cy0, r);
      drawWave(t => 1 / Math.sin(t), '#56d364', active.csc, wsx, ww, cy0, r);
      drawWave(t => 1 / Math.cos(t), '#79c0ff', active.sec, wsx, ww, cy0, r);
      drawWave(t => Math.cos(t) / Math.sin(t), '#d2a8ff', active.cot, wsx, ww, cy0, r);

      if (isPlaying) {
        angle += 0.025;
      }
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
