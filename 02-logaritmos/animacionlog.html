<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; background-color: #0e1117; font-family: sans-serif; color: white; overflow: hidden; }
  .toolbar { padding: 6px 12px; background: #161b22; border-radius: 8px; margin-bottom: 8px; border: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; }
  button { background-color: #238636; color: white; border: none; padding: 6px 14px; font-size: 13px; font-weight: 600; border-radius: 6px; cursor: pointer; }
  button.paused { background-color: #d29922; }
  canvas { display: block; width: 100%; height: 280px; background-color: #0e1117; border-radius: 8px; border: 1px solid #21262d; }
</style>
</head>
<body>
  <div class="toolbar">
    <button id="pBtn" onclick="togglePlay()">__BTN_PAUSE__</button>
    <span style="font-size:13px; color:#8b949e;">Real World (×10 each step) vs. Logarithm (+1 step counter)</span>
  </div>
  <canvas id="stepCanvas"></canvas>

  <script>
    const cv = document.getElementById('stepCanvas');
    const ctx = cv.getContext('2d');
    let playing = true;
    let timer = 0;
    let step = 0; // De 0 a 6

    function togglePlay() {
      playing = !playing;
      const b = document.getElementById('pBtn');
      b.innerText = playing ? "__BTN_PAUSE__" : "__BTN_PLAY__";
      b.classList.toggle("paused", !playing);
    }

    function animate() {
      const w = cv.clientWidth || window.innerWidth || 800;
      const h = 280;
      if (cv.width !== w || cv.height !== h) {
        cv.width = w;
        cv.height = h;
      }
      ctx.clearRect(0, 0, w, h);

      if (playing) {
        timer += 1;
        if (timer % 75 === 0) {
          step = (step + 1) % 7; // Cicla de 0 a 6 pasos
        }
      }

      const realValue = Math.pow(10, step);
      const midX = w / 2;

      // Línea divisoria central
      ctx.strokeStyle = '#30363d';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(midX, 20);
      ctx.lineTo(midX, h - 20);
      ctx.stroke();

      // ==========================================
      // LADO IZQUIERDO: MUNDO REAL (EXPLOSIÓN ×10)
      // ==========================================
      ctx.fillStyle = '#f85149';
      ctx.font = 'bold 15px sans-serif';
      ctx.fillText("1. REAL WORLD (Multiplies ×10)", 30, 35);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 34px monospace';
      ctx.fillText(realValue.toLocaleString(), 30, 85);

      ctx.fillStyle = '#8b949e';
      ctx.font = '13px sans-serif';
      const zerosText = step === 0 ? "Start (1)" : `1 followed by ${step} zero${step > 1 ? 's' : ''}`;
      ctx.fillText(zerosText, 30, 110);

      // Barra visual que crece exponencialmente
      const maxBarW = midX - 60;
      const expBarW = Math.max(6, (realValue / 1000000) * maxBarW);
      ctx.fillStyle = '#21262d';
      ctx.fillRect(30, 135, maxBarW, 28);
      ctx.fillStyle = '#f85149';
      ctx.fillRect(30, 135, expBarW, 28);

      ctx.fillStyle = '#8b949e';
      ctx.font = '12px sans-serif';
      ctx.fillText("Notice how steps 0, 1, 2, 3 look invisible next to 1,000,000!", 30, 185);

      // ==========================================
      // LADO DERECHO: LOGARITMO (ESCALERA +1)
      // ==========================================
      const rx = midX + 30;
      ctx.fillStyle = '#3fb950';
      ctx.font = 'bold 15px sans-serif';
      ctx.fillText("2. LOGARITHM BASE 10 (Counts Steps)", rx, 35);

      ctx.fillStyle = '#3fb950';
      ctx.font = 'bold 34px monospace';
      ctx.fillText(`log₁₀ = ${step}`, rx, 85);

      ctx.fillStyle = '#8b949e';
      ctx.font = '13px sans-serif';
      ctx.fillText(`Step ${step} of 6 (Calm, linear growth)`, rx, 110);

      // Dibujar 6 escalones iguales iluminados según el paso
      const blockW = (maxBarW - 30) / 6;
      for (let i = 1; i <= 6; i++) {
        ctx.fillStyle = i <= step ? '#3fb950' : '#21262d';
        ctx.fillRect(rx + (i - 1) * (blockW + 5), 135, blockW, 28);
      }

      ctx.fillStyle = '#8b949e';
      ctx.font = '12px sans-serif';
      ctx.fillText("Every ×10 jump becomes just +1 neat block!", rx, 185);

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
