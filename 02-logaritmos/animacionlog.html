<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; background-color: #0e1117; font-family: sans-serif; color: white; overflow: hidden; }
  .toolbar { padding: 6px 12px; background: #161b22; border-radius: 8px; margin-bottom: 8px; border: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; }
  button { background-color: #238636; color: white; border: none; padding: 6px 14px; font-size: 13px; font-weight: 600; border-radius: 6px; cursor: pointer; }
  button.paused { background-color: #d29922; }
  canvas { display: block; width: 100%; height: 300px; background-color: #0e1117; border-radius: 8px; border: 1px solid #21262d; }
</style>
</head>
<body>
  <div class="toolbar">
    <button id="pBtn" onclick="togglePlay()">__BTN_PAUSE__</button>
    <span style="font-size:13px; color:#8b949e;">Left: Step Staircase (×10 per step) | Right: Resulting Logarithmic Curve</span>
  </div>
  <canvas id="stepCanvas"></canvas>

  <script>
    const cv = document.getElementById('stepCanvas');
    const ctx = cv.getContext('2d');
    let playing = true;
    let timer = 0;
    let currentStep = 0; // 0 a 6

    function togglePlay() {
      playing = !playing;
      const b = document.getElementById('pBtn');
      b.innerText = playing ? "__BTN_PAUSE__" : "__BTN_PLAY__";
      b.classList.toggle("paused", !playing);
    }

    function animate() {
      const w = cv.clientWidth || window.innerWidth || 800;
      const h = 300;
      if (cv.width !== w || cv.height !== h) {
        cv.width = w;
        cv.height = h;
      }
      ctx.clearRect(0, 0, w, h);

      if (playing) {
        timer += 1;
        if (timer % 70 === 0) {
          currentStep = (currentStep + 1) % 7;
        }
      }

      const midX = w * 0.44;
      const baseLineY = h - 45;
      const maxH = 190;
      const stepH = maxH / 6;

      // ==========================================
      // LADO IZQUIERDO: ESCALERA DE PELDAÑOS JUNTOS
      // ==========================================
      const stairStartX = 35;
      const stairTotalW = midX - 65;
      const stepW = stairTotalW / 6;

      ctx.fillStyle = '#c9d1d9';
      ctx.font = 'bold 14px sans-serif';
      ctx.fillText("1. Step Counter (Each block = ×10)", stairStartX, 28);

      // Dibujar los 6 peldaños pegados formando una escalera real
      for (let i = 1; i <= 6; i++) {
        const bx = stairStartX + (i - 1) * stepW;
        const bh = i * stepH;
        const by = baseLineY - bh;

        ctx.fillStyle = i <= currentStep ? '#3fb950' : '#161b22';
        ctx.strokeStyle = '#30363d';
        ctx.lineWidth = 1;
        ctx.fillRect(bx, by, stepW, bh);
        ctx.strokeRect(bx, by, stepW, bh);

        // Número de escalón abajo
        ctx.fillStyle = i <= currentStep ? '#3fb950' : '#8b949e';
        ctx.font = '11px monospace';
        ctx.fillText(`${i}`, bx + stepW / 2 - 4, baseLineY + 16);
      }

      // Etiqueta del valor real actual encima de la escalera
      const realVal = Math.pow(10, currentStep);
      ctx.fillStyle = '#f0883e';
      ctx.font = 'bold 16px monospace';
      ctx.fillText(`Value: ${realVal.toLocaleString()}  →  Step (log₁₀): ${currentStep}`, stairStartX, baseLineY + 36);

      // ==========================================
      // LADO DERECHO: GRÁFICA LOGARÍTMICA EN VIVO
      // ==========================================
      const gx0 = midX + 45;
      const gw = w - gx0 - 30;

      ctx.fillStyle = '#c9d1d9';
      ctx.font = 'bold 14px sans-serif';
      ctx.fillText("2. Logarithmic Curve (Flattening Giants)", gx0, 28);

      // Ejes de la gráfica derecha
      ctx.strokeStyle = '#30363d';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(gx0, baseLineY - maxH - 10);
      ctx.lineTo(gx0, baseLineY);
      ctx.lineTo(gx0 + gw, baseLineY);
      ctx.stroke();

      // Líneas guía horizontales para cada escalón (1 a 6)
      for (let i = 1; i <= 6; i++) {
        const gy = baseLineY - i * stepH;
        ctx.save();
        ctx.strokeStyle = '#21262d';
        ctx.beginPath();
        ctx.moveTo(gx0, gy);
        ctx.lineTo(gx0 + gw, gy);
        ctx.stroke();
        ctx.fillStyle = '#8b949e';
        ctx.font = '10px monospace';
        ctx.fillText(`${i}`, gx0 - 16, gy + 3);
        ctx.restore();
      }

      // Dibujar la curva suave log10(x) hasta el paso actual
      const maxVal = 1000000;
      // Usamos una escala visual mixta para mostrar los 6 saltos claramente en la gráfica
      ctx.strokeStyle = '#58a6ff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      for (let s = 0; s <= currentStep; s += 0.05) {
        const px = gx0 + (s / 6) * gw;
        const py = baseLineY - s * stepH;
        if (s === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.stroke();

      // Puntos hitos en la gráfica derecha
      for (let s = 0; s <= currentStep; s++) {
        const px = gx0 + (s / 6) * gw;
        const py = baseLineY - s * stepH;
        ctx.fillStyle = s === currentStep ? '#f0883e' : '#58a6ff';
        ctx.beginPath();
        ctx.arc(px, py, s === currentStep ? 6 : 4, 0, 2 * Math.PI);
        ctx.fill();
      }

      // Línea conectora desde el escalón actual izquierdo hasta su punto en la gráfica derecha
      if (currentStep > 0) {
        const activeStairX = stairStartX + currentStep * stepW;
        const activeY = baseLineY - currentStep * stepH;
        const activeGraphX = gx0 + (currentStep / 6) * gw;

        ctx.save();
        ctx.strokeStyle = '#f0883e';
        ctx.globalAlpha = 0.65;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(activeStairX, activeY);
        ctx.lineTo(activeGraphX, activeY);
        ctx.stroke();
        ctx.restore();
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
